<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,
 initial-scale=1.0">
<title>AI Lyrics Studio</title>
<link rel="stylesheet"
 href="https://googleapis.com">
<style>
body {
 margin: 0;
 font-family: sans-serif;
 background: #09090b;
 color: #fff;
 padding-bottom: 50px;
}
.header {
 background: linear-gradient(
  45deg, #f09433,
  #dc2743, #bc1888
 );
 padding: 12px 15px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 font-size: 17px;
 font-weight: bold;
}
.share-btn {
 background: #000;
 color: #fff;
 border: none;
 padding: 7px 13px;
 border-radius: 15px;
 font-size: 12px;
 font-weight: bold;
}
.ad-btn {
 display: block;
 background: #18181b;
 color: #ffcc00;
 text-align: center;
 padding: 9px;
 font-size: 13px;
 font-weight: bold;
 text-decoration: none;
}
.container {
 padding: 12px;
 max-width: 480px;
 margin: auto;
}
.card {
 background: #141417;
 padding: 13px;
 border-radius: 15px;
 border: 1px solid #27272a;
 margin-bottom: 12px;
}
label {
 display: block;
 font-size: 12px;
 color: #ff4d88;
 margin-bottom: 5px;
 font-weight: bold;
}
.row {
 display: flex;
 gap: 8px;
 margin-bottom: 9px;
}
input, select {
 flex: 1;
 padding: 10px;
 border-radius: 10px;
 border: 1px solid #333;
 background: #202024;
 color: #fff;
 font-size: 13px;
 width: 100%;
}
.btn-main {
 background: #ff0055;
 color: #fff;
 border: none;
 padding: 0 16px;
 border-radius: 10px;
 font-weight: bold;
 font-size: 14px;
}
.btn-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 8px;
 margin-bottom: 9px;
}
.btn-sub {
 padding: 10px 6px;
 border: 1px solid #333;
 border-radius: 10px;
 background: #1f1f23;
 color: #fff;
 font-weight: bold;
 font-size: 12px;
}
.btn-color {
 border-color: #ff9800;
 color: #ffcc80;
}
.btn-dance {
 border-color: #00e5ff;
 color: #84ffff;
}
.save-row {
 display: flex;
 gap: 8px;
}
.btn-dl {
 flex: 1;
 padding: 11px;
 border: none;
 border-radius: 10px;
 background: #00c853;
 color: #fff;
 font-weight: bold;
 font-size: 13px;
}
.btn-vid {
 flex: 1;
 padding: 11px;
 border: none;
 border-radius: 10px;
 background: #651fff;
 color: #fff;
 font-weight: bold;
 font-size: 13px;
}
#status {
 text-align: center;
 font-size: 12px;
 color: #ffcc00;
 margin-top: 8px;
 min-height: 16px;
}
.preview-box {
 text-align: center;
 margin-top: 8px;
}
canvas {
 width: 100%;
 max-width: 390px;
 border-radius: 10px;
 background: #f7f4eb;
}
</style>
</head>
<body>

<div class="header">
 <span>✨ AI Lyrics Studio</span>
 <button onclick="shareApp()"
  class="share-btn">
  📲 शेयर करें
 </button>
</div>

<a href="https://bicea.org"
 target="_blank"
 class="ad-btn">
 🎁 स्पेशल ऑफर देखें (Sponsored)
</a>

<div class="container">
 <div class="card">
  <label>
   1. गाने का नाम लिखें:
  </label>
  <div class="row">
   <input type="text"
    id="songInput"
    value="Apna Choudhary"
    placeholder="गाने का नाम...">
   <button class="btn-main"
    onclick="autoCreateAll()">
    ✨ बनाएं
   </button>
  </div>

  <div class="row">
   <select id="characterStyle"
    onchange="generateArt()">
    <option value="handsome desi boy beard sunglasses">
     😎 देसी स्वैग स्टाइल
    </option>
    <option value="indian boy near black scorpio jeep">
     🚙 काली गाड़ी स्टाइल
    </option>
    <option value="indian couple holding hands romantic">
     ❤️ रोमांटिक कपल
    </option>
    <option value="sad broken heart boy in rain">
     💔 सैड आशिक स्टाइल
    </option>
    <option value="beautiful indian girl open hair jhumka">
     💃 स्टाइलिश लड़की
    </option>
    <option value="indian boy dancing party vibe">
     🕺 फुल डांस मूड
    </option>
    <option value="lord rama warrior bow and arrow">
     🏹 योद्धा / धार्मिक
    </option>
   </select>

   <select id="fontStyle">
    <option value="Kalam">
     ✍️ देसी (Kalam)
    </option>
    <option value="Caveat">
     ✒️ कर्सिव (Caveat)
    </option>
    <option value="Tillana">
     🖌️ ब्रश (Tillana)
    </option>
    <option value="Permanent Marker">
     🖊️ मार्कर (Bold)
    </option>
   </select>
  </div>

  <div class="btn-grid">
   <button class="btn-sub"
    onclick="changeLyricsLines()">
    🔄 लाइनें बदलें
   </button>
   <button class="btn-sub"
    onclick="generateArt()">
    🖼️ फोटो बदलें
   </button>
   <button class="btn-sub btn-color"
    id="colorModeBtn"
    onclick="toggleColorMode()">
    🌈 नीला पेन स्केच
   </button>
   <button class="btn-sub btn-dance"
    id="danceModeBtn"
    onclick="toggleDanceMode()">
    💃 डांस: ऑन
   </button>
  </div>

  <div class="save-row">
   <button class="btn-dl"
    onclick="downloadPoster()">
    ⬇️ फोटो सेव
   </button>
   <button class="btn-vid"
    onclick="recordReelVideo()">
    🎥 वीडियो सेव (6s)
   </button>
  </div>
  <div id="status"></div>
 </div>

 <div class="preview-box">
  <canvas id="posterCanvas"
   width="720"
   height="1280">
  </canvas>
 </div>
</div>

<script>
const canvas =
 document.getElementById('posterCanvas');
const ctx = canvas.getContext('2d');

let allChunks = [];
let chunkIdx = 0;
let currentTitle = "Apna Choudhary";
let currentLines = [
 "नाम ही काफी है पहचान के लिए,",
 "चौधर चलती है अपनी शान के लिए,",
 "यार सारे खड़े हैं साथ हमेशा,",
 "जान भी हाज़िर है भाईजान के लिए..."
];
let aiArtImg = null;

let colorMode = 0;
const colorModes = [
 {
  name: "नीला पेन स्केच",
  prompt: "blue ballpoint pen sketch",
  tCol: "#1b2a6b",
  lCol: "#1e293b",
  paper: "#f7f4eb"
 },
 {
  name: "फुल कलरफुल",
  prompt: "vibrant colorful ink art",
  tCol: "#d90429",
  lCol: "#1d3557",
  paper: "#fffdf7"
 },
 {
  name: "ब्लैक स्केच",
  prompt: "black pencil sketch art",
  tCol: "#111111",
  lCol: "#222222",
  paper: "#f4f1ea"
 }
];

let danceMode = 0;
const danceModes = [
 "डांस: ऑन",
 "फुल जंप",
 "डांस: बंद"
];

function shareApp() {
 const u = window.location.href;
 if (navigator.share) {
  navigator.share({
   title: 'AI Lyrics Studio',
   url: u
  });
 } else {
  navigator.clipboard.writeText(u);
  alert('लिंक कॉपी हो गया!');
 }
}

function toggleColorMode() {
 colorMode = (colorMode + 1) % 3;
 const m = colorModes[colorMode];
 document.getElementById(
  'colorModeBtn'
 ).innerText = "🌈 " + m.name;
 generateArt();
}

function toggleDanceMode() {
 danceMode = (danceMode + 1) % 3;
 document.getElementById(
  'danceModeBtn'
 ).innerText = "💃 " +
  danceModes[danceMode];
}

function autoCreateAll() {
 const inp = document.getElementById(
  'songInput'
 );
 const s = inp.value.trim();
 if (!s) return;
 currentTitle = s;
 setStatus("⏳ लिरिक्स व फोटो बन रही है...");
 fetchAutoLyrics(s);
 generateArt();
}

function setStatus(msg) {
 document.getElementById(
  'status'
 ).innerText = msg;
}

async function fetchAutoLyrics(song) {
 try {
  const q = encodeURIComponent(song);
  const url =
   "https://lrclib.net"
   + q;
  const res = await fetch(url);
  const data = await res.json();
  let raw = "";

  if (data && data.length > 0 &&
      data.plainLyrics) {
   raw = data.plainLyrics;
  } else {
   const p = encodeURIComponent(
    "Write 16 short Hindi lyrics lines for "
    + song
   );
   const r2 = await fetch(
    "https://pollinations.ai"
    + p
   );
   raw = await r2.text();
  }

  const arr = raw.split('\n')
   .map(l => l.trim())
   .filter(l => l.length > 0);

  if (arr.length > 0) {
   allChunks = [];
   for (let i = 0;
        i < arr.length;
        i += 11) {
    allChunks.push(
     arr.slice(i, i + 11)
    );
   }
   chunkIdx = 0;
   currentLines = allChunks;
  }
 } catch (e) {
  console.log(e);
 }
}

function changeLyricsLines() {
 if (allChunks.length <= 1) {
  setStatus("ℹ️ और लाइनें नहीं हैं।");
  return;
 }
 chunkIdx =
  (chunkIdx + 1) % allChunks.length;
 currentLines = allChunks[chunkIdx];
 setStatus("✅ नई लाइनें लग गईं!");
}

function generateArt() {
 const st = document.getElementById(
  'characterStyle'
 ).value;
 const m = colorModes[colorMode];
 setStatus("🎨 " + m.name +
  " बन रहा है...");

 const p = encodeURIComponent(
  m.prompt + " of " + st +
  ", theme " + currentTitle +
  ", isolated on solid white background, no text"
 );
 const sd = Math.floor(
  Math.random() * 999999
 );
 const url =
  "https://pollinations.ai"
  + p +
  "?width=512&height=896&seed="
  + sd + "&nologo=true";

 const img = new Image();
 img.crossOrigin = "Anonymous";
 img.onload = function() {
  aiArtImg = img;
  setStatus("✅ तैयार है! नीचे देखें");
 };
 img.onerror = function() {
  setStatus("❌ दोबारा 'फोटो बदलें' दबाएं");
 };
 img.src = url;
}

function animateLoop(ts) {
 try {
  const w = canvas.width;
  const h = canvas.height;
  const m = colorModes[colorMode];
  const f = document.getElementById(
   'fontStyle'
  ).value;

  ctx.globalCompositeOperation =
   'source-over';
  ctx.fillStyle = m.paper;
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = '#b8c4d0';
  ctx.lineWidth = 2;
  for (let y = 230;
       y < h - 40;
       y += 44) {
   ctx.beginPath();
   ctx.moveTo(65, y);
   ctx.lineTo(w - 20, y);
   ctx.stroke();
  }

  ctx.strokeStyle = '#e63946';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(65, 212);
  ctx.lineTo(w - 20, 212);
  ctx.moveTo(65, 219);
  ctx.lineTo(w - 20, 219);
  ctx.stroke();

  for (let y = 35;
       y < h - 20;
       y += 42) {
   ctx.fillStyle = '#18181b';
   ctx.beginPath();
   ctx.arc(36, y, 9, 0, 6.28);
   ctx.fill();

   ctx.strokeStyle = '#555';
   ctx.lineWidth = 5;
   ctx.beginPath();
   ctx.moveTo(0, y - 4);
   ctx.lineTo(36, y);
   ctx.stroke();
  }

  if (aiArtImg &&
      aiArtImg.complete &&
      aiArtImg.naturalWidth > 0) {
   ctx.save();
   ctx.globalCompositeOperation =
    'multiply';

   const sw = 400;
   const sh = (aiArtImg.height /
    aiArtImg.width) * sw;
   const bx = w - sw / 2 - 205;
   const by = h - 25;

   const t = (ts || 0) * 0.006;
   let ang = 0;
   let byOff = 0;
   let sy = 1;
