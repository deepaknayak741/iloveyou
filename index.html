<!DOCTYPE html>

<meta charset="UTF-8">

<title>Vanish Chat Pro</title>
<style>
  :root {
    --bg: radial-gradient(circle at top right, #1a103c, #090a10 70%);
    --glass: rgba(255, 255, 255, 0.06);
    --border: rgba(0, 243, 255, 0.25);
    --neon: #00f3ff;
    --text: #ffffff;
    --me-bg: linear-gradient(135deg, #00c6ff, #0072ff);
    --other-bg: rgba(255, 255, 255, 0.1);
  }
  body.warm { --bg: radial-gradient(circle at top right, #3b1c0a, #120804 70%); --border: rgba(255, 165, 0, 0.35); --neon: #ffae00; --me-bg: linear-gradient(135deg, #ff8008, #ffc837); }
  body.calm { --bg: radial-gradient(circle at top right, #0a362c, #051411 70%); --border: rgba(0, 255, 170, 0.3); --neon: #00ffaa; --me-bg: linear-gradient(135deg, #11998e, #38ef7d); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  header { padding: 12px 16px; background: rgba(10, 12, 20, 0.75); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; }
  .brand { font-size: 21px; font-weight: 800; background: linear-gradient(90deg, var(--neon), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; user-select: none; }
  .room-badge { background: var(--glass); border: 1px solid var(--border); color: var(--neon); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .sub-bar { padding: 6px 15px; font-size: 11px; color: rgba(255,255,255,0.65); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); }
  .themes { display: flex; gap: 6px; }
  .t-btn { padding: 3px 9px; border-radius: 12px; border: 1px solid var(--border); background: var(--glass); color: #fff; font-size: 10px; cursor: pointer; }
  #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 18px 18px 18px 4px; background: var(--other-bg); border: 1px solid rgba(255,255,255,0.12); align-self: flex-start; font-size: 15px; word-wrap: break-word; }
  .msg.me { background: var(--me-bg); color: #050a14; font-weight: 500; border-radius: 18px 18px 4px 18px; align-self: flex-end; border: none; }
  .msg.ghost { align-self: center; background: rgba(20, 20, 25, 0.9); color: #ffd700; border: 1px dashed #ffd700; border-radius: 14px; text-align: center; }
  .msg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 11px; opacity: 0.8; margin-bottom: 4px; font-weight: bold; }
  .del-btn { background: rgba(255, 50, 50, 0.2); border: 1px solid rgba(255, 80, 80, 0.5); color: #ff4d4d; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .msg.me .del-btn { background: rgba(0,0,0,0.2); color: #fff; border-color: rgba(0,0,0,0.3); }
  .magic-bar { display: flex; gap: 8px; padding: 8px 12px; overflow-x: auto; background: rgba(15, 18, 30, 0.85); border-top: 1px solid var(--border); scrollbar-width: none; }
  .magic-bar::-webkit-scrollbar { display: none; }
  .m-chip { background: var(--glass); border: 1px solid var(--border); color: #fff; padding: 5px 11px; border-radius: 15px; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .box { padding: 10px 12px; background: rgba(10, 12, 20, 0.95); display: flex; gap: 8px; align-items: center; }
  input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid var(--border); background: rgba(255,255,255,0.08); color: #fff; font-size: 15px; outline: none; }
  .send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--me-bg); color: #000; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .card { background: #121524; border: 1px solid var(--neon); color: #fff; padding: 24px; border-radius: 22px; width: 88%; max-width: 340px; text-align: center; }
  .card h3 { margin-top: 0; color: var(--neon); font-size: 22px; }
  .card input { width: 100%; margin-bottom: 12px; }
  .card button { width: 100%; padding: 12px; border-radius: 25px; border: none; background: var(--me-bg); color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
  .ad-wrap { background: #000; display: flex; justify-content: center; min-height: 50px; }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="tap()">⚡ Vanish Chat</div>
  <button class="room-badge" onclick="exit()">Room: <span id="rc">---</span> ✕</button>
</header>

<div class="sub-bar">

  <div class="themes">

    <button class="t-btn" onclick="document.body.className='warm'">Gold</button>
    <button class="t-btn" onclick="document.body.className='calm'">Emerald</button>
  </div>
</div>

<div id="chat"></div>

<div class="magic-bar">

  <span class="m-chip" onclick="addTxt('👑')">👑</span>

  <span class="m-chip" onclick="addTxt('😂')">😂</span>

  <span class="m-chip" onclick="addTxt('😎')">😎</span>

  <span class="m-chip" onclick="addTxt('★彡[KING]彡★')">★彡[KING]彡★</span>
</div>

<div class="box">
  <input id="mi" placeholder="Type special message..." onkeypress="if(event.key==='Enter')send()">
  <button class="send-btn" onclick="send()">➤</button>
</div>

<div class="modal" id="nm">
  <div class="card">
    <h3>⚡ Vanish Chat Pro</h3>
    <p style="font-size:12px;opacity:0.7;margin-bottom:15px">Enter secret room to start private chat</p>
    <input id="ni" placeholder="Your Nickname (e.g. Deepak)">
    <input id="ri" placeholder="Secret Room Code (e.g. 5050)">
    <button onclick="join()">Enter Private Room 🚀</button>
  </div>
</div>

<div class="modal" id="admModal" style="display:none">
  <div class="card" style="border-color:#ffd700">
    <h3 style="color:#ffd700">🛡️ Vault Admin Login</h3>
    <p style="font-size:11px;opacity:0.7">Secured by Firebase Auth</p>
    <input id="admEmail" type="email" placeholder="Admin Secret Email">
    <input id="admPass" type="password" placeholder="Admin Secret Password">
    <button onclick="adminLogin()" style="background:linear-gradient(135deg,#ffd700,#ff8c00)">Unlock Vault 🔓</button>
    <button onclick="document.getElementById('admModal').style.display='none'" style="background:transparent;color:#aaa;margin-top:8px;font-size:12px">Cancel</button>
  </div>
</div>

<div class="ad-wrap">
  <script>
    atOptions = {
      'key' : '9e879068a767282e0ddf2b2b24d2366e',
      'format' : 'iframe',
      'height' : 50,
      'width' : 320,
      'params' : {}
    };
  </script>
  <script src="https://bicea.org/22/9e879068a767282e0ddf2b2b24d2366e
    "></script>
</div>
<script>
const BASE = "https://vanishchat-5874b-default-rtdb.firebaseio" + ".com/rooms";
let nick = localStorage.getItem("n") || "", room = localStorage.getItem("rm") || "", taps = 0, lastData = "";

if (nick && room) {
  document.getElementById("nm").style.display = "none";
  document.getElementById("rc").innerText = room;
}

function addTxt(txt) { let i = document.getElementById("mi"); i.value += txt; i.focus(); }

function playBeep() {
  try {
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.setValueAtTime(600, ctx.currentTime);
    gain.gain.setValueAtTime(0.05, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.08);
  } catch(e) {}
}

function join() {
  let v = document.getElementById("ni").value.trim();
  let r = document.getElementById("ri").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
  if (v && r) {
    nick = v; room = r;
    localStorage.setItem("n", v); localStorage.setItem("rm", r);
    document.getElementById("nm").style.display = "none";
    document.getElementById("rc").innerText = room;
    load(true);
  }
}

function exit() { localStorage.removeItem("rm"); location.reload(); }

function tap() { taps++; if (taps == 5) { taps = 0; document.getElementById("admModal").style.display = "flex"; } }

async function adminLogin() {
  let em = document.getElementById("admEmail").value.trim();
  let pw = document.getElementById("admPass").value.trim();
  if (!em || !pw) return alert("Email aur Password dalein!");
  
  let res = await fetch(BASE + ".json");
  let all = await res.json();
  document.getElementById("admModal").style.display = "none";
  let list = all ? Object.keys(all).join(", ") : "None";
  let ch = prompt("🛡️ ADMIN VAULT UNLOCKED\nActive Rooms: " + list + "\n\n1: Jump to any Room\n2: Send VIP Ghost Message\n3: Delete Entire Room");
  if (ch == "1") {
    let tr = prompt("Enter Room Code:");
    if (tr) { room = tr; document.getElementById("rc").innerText = room; load(true); }
  } else if (ch == "2") {
    let gm = prompt("VIP Ghost Message:");
    if (gm) post("👑 ADMIN GHOST", gm, 1);
  } else if (ch == "3") {
    let dr = prompt("Room Code to Wipe:");
    if (dr) { await fetch(`${BASE}/${dr}.json`, { method: "DELETE" }); alert("Room Wiped!"); load(true); }
  }
}

async function post(n, t, g) {
  if (!room) return;
  playBeep();
  await fetch(`${BASE}/${room}.json`, { method: "POST", body: JSON.stringify({ n: n, t: t, g: g, time: Date.now() }) });
  load(true);
}

function send() {
  let i = document.getElementById("mi"), v = i.value.trim();
  if (v && nick && room) { post(nick, v, 0); i.value = ""; }
}

async function delMsg(key) {
  if (!room || !key) return;
  playBeep();
  await fetch(`${BASE}/${room}/${key}.json`, { method: "DELETE" });
  load(true);
}

async function load(force = false) {
  if (!room) return;
  try {
    let r = await fetch(`${BASE}/${room}.json`);
    let d = await r.json();
    let str = JSON.stringify(d);
    if (!force && str === lastData) return;
    lastData = str;

    let c = document.getElementById("chat");
    c.innerHTML = "";
    if (!d) return;

    Object.keys(d).forEach(k => {
      let m = d[k];
      let div = document.createElement("div");
      div.className = m.g ? "msg ghost" : (m.n == nick ? "msg me" : "msg");
      let canDel = (m.n === nick || m.g === 1);
      let delHtml = canDel ? `<button class="del-btn" onclick="delMsg('${k}')">✕</button>` : "";
      div.innerHTML = `<div class="msg-head"><span>${m.n}</span>${delHtml}</div><div>${m.t}</div>`;
      c.appendChild(div);
    });
    c.scrollTop = c.scrollHeight;
  } catch (e) {}
}

load(true);
setInterval(() => load(false), 1500);
</script>
