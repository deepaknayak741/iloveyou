<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
input,button{width:90%;padding:12px;margin:8px 0;font-size:16px;border-radius:8px;border:0}
button{background:#0095f6;color:#fff;font-weight:bold}
</style>
</head>
<body>

<div id="b1">
<h3>4-अंकों का पासवर्ड</h3>
<input type="password" id="p" maxlength="4" placeholder="****">
<button onclick="c1()">आगे बढ़ें</button>
</div>

<div id="b2" style="display:none">
<h3>मोबाइल और ID</h3>
<input type="tel" id="m" placeholder="मोबाइल नंबर">
<input type="text" id="u" placeholder="इंस्टाग्राम ID">
<button onclick="c2()">मैसेज देखें</button>
</div>

<script>
function c1(){
  var p = document.getElementById("p").value;
  if(p == "1234"){
    document.getElementById("b1").style.display="none";
    document.getElementById("b2").style.display="block";
  } else {
    alert("गलत पासवर्ड!");
  }
}

function c2(){
  var m = document.getElementById("m").value.trim();
  var u = document.getElementById("u").value.trim();
  
  if(m == "6367834857" || m == "9876543211"){
    if(u != ""){
      location.href = "https://instagram.com";
    } else {
      alert("इंस्टाग्राम ID डालें!");
    }
  } else {
    alert("गलत मोबाइल नंबर!");
  }
}
</script>

</body>
</html>
