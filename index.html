<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Animated Lyrics & Art Maker</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  body { margin: 0; font-family: sans-serif; background: #09090b; color: #fff; padding-bottom: 50px; }
  .header { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: bold; }
  .share-btn { background: #000; color: #fff; border: none; padding: 7px 13px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .ad-btn { display: block; background: #18181b; color: #ffcc00; text-align: center; padding: 9px; font-size: 13px; font-weight: bold; text-decoration: none; border-bottom: 1px solid #27272a; }
  
  .container { padding: 12px; max-width: 480px; margin: auto; }
  .card { background: #141417; padding: 13px; border-radius: 15px; border: 1px solid #27272a; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: #ff4d88; margin-bottom: 5px; font-weight: bold; }
  
  .row { display: flex; gap: 8px; margin-bottom: 9px; }
  input[type="text"], select {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #333;
    background: #202024; color: #fff; font-size: 13px; outline: none; width: 100%;
  }
  .btn-main { background: linear-gradient(90deg, #ff0055, #ff5500); color: #fff; border: none; padding: 0 16px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; white-space: nowrap; }

  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 9px; }
  .btn-sub { padding: 10px 6px; border: 1px solid #333; border-radius: 10px; background: #1f1f23; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer; }
  .btn-sub:active { background: #333; }
  .btn-color { border-color: #ff9800; color: #ffcc80; }
  .btn-dance { border-color: #00e5ff; color: #84ffff; }

  .save-row { display: flex; gap: 8px; }
  .btn-dl { flex: 1; padding: 11px; border: none; border-radius: 10px; background: #00c853; color: #fff; font-weight: bold; font-size: 13px; cursor: pointer; }
  .btn-vid { flex: 1; padding: 11px; border: none; border-radius: 10px; background: #651fff; color: #fff; font-weight: bold; font-size: 13px; cursor: pointer; }

  #status { text-align: center; font-size: 12px; color: #ffcc00; margin-top: 8px; min-height: 16px; }
  .preview-box { text-align: center; margin-top: 8px; }
  canvas { width: 100%; max-width: 390px; border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.95); background: #f7f4eb; }
</style>
</head>
<body>

<div class="header">
  <span>✨ AI Dance Lyrics Studio</span>
  <button onclick="shareApp()" class="share-btn">📲 शेयर करें</button>
</div>

<a href="https://bicea.org" target="_blank" class="ad-btn">
  🎁 यहाँ क्लिक करें और स्पेशल ऑफर देखें (Sponsored)
</a>

<div class="container">
  <div class="card">
    <label>1. गाने का नाम लिखें (फोटो व लिरिक्स अपने आप बनेंगे):</label>
    <div class="row">
      <input type="text" id="songInput" placeholder="जैसे: Dollar, 2 Khatole, Gadi 150..." value="Dollar">
      <button class="btn-main" onclick="autoCreateAll()">✨ बनाएं</button>
    </div>

    <div class="row">
      <select id="characterStyle" onchange="generateArt()">
        <option value="handsome indian desi boy with beard sunglasses and stylish hair, holding stick, attitude pose">😎 हरियाणवी / देसी स्वैग स्टाइल</option>
        <option value="stylish indian gangster boy standing near black scorpio jeep, sunglasses, cool attitude">🚙 काली गाड़ी / थार स्टाइल</option>
        <option value="indian couple holding hands, romantic aesthetic look, traditional modern outfit">❤️ रोमांटिक कपल स्टाइल</option>
        <option value="sad broken heart indian boy sitting alone in rain, emotional look">💔 सैड / दिल टूटा आशिक स्टाइल</option>
        <option value="beautiful indian girl with open hair and jhumka, stylish attitude pose">💃 स्टाइलिश लड़की स्टाइल</option>
        <option value="indian boy dancing energetically with raised hand, party celebration vibe">🕺 फुल डांस / पार्टी मूड</option>
        <option value="lord rama or warrior with bow and arrow, divine heroic stance">🏹 योद्धा / धार्मिक स्टाइल</option>
      </select>

      <select id="fontStyle">
        <option value="Kalam">✍️ देसी लिखावट (Kalam)</option>
        <option value="Caveat">✒️ कर्सिव पेन (Caveat)</option>
        <option value="Tillana">🖌️ आर्टिस्टिक ब्रश (Tillana)</option>
        <option value="Permanent Marker">🖊️ बोल्ड मार्कर (Marker)</option>
      </select>
    </div>

    <div class="btn-grid">
      <button class="btn-sub" onclick="changeLyricsLines()">🔄 लाइनें बदलें</button>
      <button class="btn-sub" onclick="generateArt()">🖼️ नया पोज़ / फोटो बदलें</button>
      <button class="btn-sub btn-color" id="colorModeBtn" onclick="toggleColorMode()">🌈 मोड: नीला पेन स्केच</button>
      <button class="btn-sub btn-dance" id="danceModeBtn" onclick="toggleDanceMode()">💃 डांस: बीट वाइब ऑन</button>
    </div>

    <div class="save-row">
      <button class="btn-dl" onclick="downloadPoster()">⬇️ फोटो सेव करें</button>
      <button class="btn-vid" onclick="recordReelVideo()">🎥 डांस वीडियो (6s) सेव करें</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="preview-box">
    <canvas id="posterCanvas" width="720" height="1280"></canvas>
  </div>
</div>

<script>
  const canvas = document.getElementById('posterCanvas');
  const ctx = canvas.getContext('2d');

  let allLyricsChunks = [];
  let currentChunkIndex = 0;
  let currentTitle = "Dollar";
  let currentLines = ["गाने का नाम लिखकर 'बनाएं' दबाएं..."];
  let aiArtImg = null;

  // 3 आर्ट मोड: 0 = नीला पेन स्केच, 1 = फुल कलरफुल पेंटिंग, 2 = काला पेंसिल स्केच
  let colorMode = 0;
  const colorModes = [
    { name: "नीला पेन स्केच", prompt: "detailed blue ballpoint pen sketch drawing, crosshatching ink art", titleColor: "#1b2a6b", textColor: "#1e293b", paper: "#f7f4eb" },
    { name: "फुल कलरफुल आर्ट", prompt: "vibrant colorful digital watercolor and ink illustration, bright colors", titleColor: "#d90429", textColor: "#1d3557", paper: "#fffdf7" },
    { name: "ब्लैक पेंसिल स्केच", prompt: "realistic black graphite pencil sketch shading art", titleColor: "#111111", textColor: "#222222", paper: "#f4f1ea" }
  ];

  // 3 डांस मोड: 0 = बीट वाइब (गाने पर झूमना), 1 = भांगड़ा/हिप-हॉप जंप, 2 = स्थिर (No Dance)
  let danceMode = 0;
  const danceModes = ["बीट वाइब ऑन", "फुल डांस जंप", "डांस बंद (स्थिर)"];

  function shareApp() {
    if (navigator.share) {
      navigator.share({
        title: 'AI Dance Lyrics Studio',
        text: 'गाने के नाम से डांसिंग नोटबुक स्केच और कलरफुल रील्स बनाएं:',
        url: window.location.href
      });
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('लिंक कॉपी हो गया है!');
    }
  }

  function toggleColorMode() {
    colorMode = (colorMode + 1) % colorModes.length;
    document.getElementById('colorModeBtn').innerText = `🌈 मोड: ${colorModes[colorMode].name}`;
    generateArt();
  }

  function toggleDanceMode() {
    danceMode = (danceMode + 1) % danceModes.length;
    document.getElementById('danceModeBtn').innerText = `💃 डांस: ${danceModes[danceMode]}`;
  }

  async function autoCreateAll() {
    const songName = document.getElementById('songInput').value.trim();
    if (!songName) return;
    currentTitle = songName;
    document.getElementById('status').innerText = "⏳ गाने की लाइनें और आर्ट तैयार हो रहा है...";
    fetchAutoLyrics(songName);
    generateArt();
  }

  async function fetchAutoLyrics(songName) {
    try {
      const res = await fetch(`https://lrclib.net{encodeURIComponent(songName)}`);
      const data = await res.json();
      let rawText = "";
      if (data && data.length > 0 && data.plainLyrics) {
        rawText = data.plainLyrics;
      } else {
        const aiPrompt = `Write famous Hindi or Haryanvi song lyrics for "${songName}". Only output 16 short lines of lyrics, no extra text.`;
        const aiRes = await fetch(`https://pollinations.ai{encodeURIComponent(aiPrompt)}`);
        rawText = await aiRes.text();
      }

      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      allLyricsChunks = [];
      for (let i = 0; i < lines.length; i += 11) {
        allLyricsChunks.push(lines.slice(i, i + 11));
      }
      currentChunkIndex = 0;
      if (allLyricsChunks.length > 0) currentLines = allLyricsChunks;
    } catch (e) {
      currentLines = ["लाइनें लोड नहीं हो सकीं, दोबारा 'बनाएं' दबाएं।"];
    }
  }

  function changeLyricsLines() {
    if (allLyricsChunks.length <= 1) {
      document.getElementById('status').innerText = "ℹ️ इस गाने में इतनी ही लाइनें उपलब्ध हैं।";
      return;
    }
    currentChunkIndex = (currentChunkIndex + 1) % allLyricsChunks.length;
    currentLines = allLyricsChunks[currentChunkIndex];
    document.getElementById('status').innerText = `✅ लाइन सेट ${currentChunkIndex + 1}/${allLyricsChunks.length} बदल गया है`;
  }

  function generateArt() {
    const status = document.getElementById('status');
    const style = document.getElementById('characterStyle').value;
    const modeObj = colorModes[colorMode];
    status.innerText = `🎨 ${modeObj.name} बन रहा है... (5-8 सेकंड रुकें)`;

    const fullPrompt = `${modeObj.prompt} of ${style}, theme ${currentTitle}, isolated on pure solid white background, clean white paper, no text, no borders`;
    const seed = Math.floor(Math.random() * 999999);
    const url = `https://pollinations.ai{encodeURIComponent(fullPrompt)}?width=512&height=896&seed=${seed}&nologo=true`;

    const img = new Image();
