<!DOCTYPE html>
<meta name="viewport"
 content="width=device-width">
<body style="background:#111;
 color:#fff">
<input id="t"
 placeholder="Page Token"><br>
<button onclick="go()">
 📡 मैसेज देखें
</button>
<div id="b"></div>
<input id="i"
 placeholder="रिप्लाई ID"><br>
<input id="x"
 placeholder="जवाब लिखें"><br>
<button onclick="sn()">
 📤 भेजें
</button>
<script>
const H =
 "https://facebook.com" +
 "/v19.0/me";
async function go() {
 let u = H + "/conversations?" +
  "platform=instagram&limit=3&" +
  "fields=participants," +
  "messages.limit(1)" +
  "{message,from}&" +
  "access_token=" +
  t.value.trim();
 let r = await fetch(u);
 let d = await r.json();
 if (d.error) {
  b.innerHTML =
   d.error.message;
  return;
 }
 b.innerHTML = d.data.map(c => {
  let m = c.messages.data.at(0);
  let p = c.participants.data
   .find(k =>
    k.id != "17841451638514561"
   );
  let uid = p ? p.id : m.from.id;
  let nm = (p && p.username)
   || "User";
  return `<p onclick=` +
   `"i.value='${uid}'">` +
   `<b>${nm}:</b> ` +
   `${m.message} ` +
   `<u>[रिप्लाई]</u></p>`;
 }).join("");
}
async function sn() {
 let u = H + "/messages?" +
  "access_token=" +
  t.value.trim();
 let r = await fetch(u, {
  method: "POST",
  headers: {
   "Content-Type":
    "application/json"
  },
  body: JSON.stringify({
   recipient: { id: i.value },
   message: { text: x.value }
  })
 });
 let d = await r.json();
 alert(d.error ?
  d.error.message : "✅ गया!");
}
</script>
