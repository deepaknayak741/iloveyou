<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" 
  content="width=device-width,initial-scale=1">
<title>Instagram</title>
<style>
  * {
    box-sizing: border-box;
    font-family: sans-serif;
  }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  body.blurred {
    filter: blur(25px);
    pointer-events: none;
  }
  header {
    padding: 10px 14px;
    background: #000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #262626;
  }
  .insta-logo {
    font-size: 24px;
    font-weight: 800;
    font-style: italic;
    background: linear-gradient(
      45deg, #f09433, #dc2743, #bc1888
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    cursor: pointer;
  }
  .h-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }
   .h-icon {
    background: none;
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    padding: 0;
  }
  .room-tag {
    background: #121212;
    border: 1px solid #363636;
    color: #aaa;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
  }
  #storiesBar {
    display: flex;
    gap: 12px;
    padding: 10px;
    overflow-x: auto;
    background: #000;
    border-bottom: 1px solid #262626;
    flex-shrink: 0;
  }
  #storiesBar::-webkit-scrollbar {
    display: none;
  }
  .story-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 62px;
    cursor: pointer;
  }
  .story-ring {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    padding: 2.5px;
    background: linear-gradient(
      45deg, #f09433, #dc2743, #bc1888
    );
    display: flex;
    align-items: center;
    justify-content: center;
   }
   .story-ring.add-ring {
    background: #262626;
    position: relative;
  }
  .story-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #121212;
    border: 2px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
  }
  .plus-badge {
    position: absolute;
    bottom: 0;
    right: 0;
    background: #0095f6;
    color: #fff;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #000;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .story-name {
    font-size: 11px;
    margin-top: 4px;
    color: #f5f5f5;
    max-width: 62px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #mediaBox, #videoCallBox {
    display: none;
    background: #000;
    border-bottom: 1px solid #262626;
    padding: 8px;
    text-align: center;
 }
   #mediaBox iframe, #videoCallBox iframe {
    width: 100%;
    height: 200px;
    border-radius: 12px;
    border: 1px solid #262626;
    background: #000;
  }
  .m-tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .m-tab {
    background: #262626;
    border: none;
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #000;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 22px;
    background: #262626;
    align-self: flex-start;
    font-size: 14.5px;
    word-wrap: break-word;
  }
  .msg.me {
    background: linear-gradient(
      135deg, #7638fa, #d300c5, #ff0069
    );
    align-self: flex-end;
    color: #fff;
 }
   .msg.post-card {
    max-width: 100%;
    width: 100%;
    background: #000;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 0;
    align-self: center;
  }
  .post-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
  }
  .post-user {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 13px;
  }
  .post-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(
      45deg, #f09433, #dc2743, #bc1888
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
  }
  .post-img {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    display: block;
  }
  .post-actions {
    display: flex;
    gap: 14px;
    padding: 10px 12px 4px;
    font-size: 20px;
     }
   .post-caption {
    padding: 4px 12px 10px;
    font-size: 13.5px;
  }
  .msg.ghost {
    background: rgba(255, 0, 51, 0.15);
    border: 1px dashed #ff3040;
    color: #ff8a93;
    align-self: center;
    text-align: center;
  }
  .msg-head {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #aaa;
    margin-bottom: 3px;
  }
  .msg-time {
    font-size: 9px;
    opacity: 0.65;
    text-align: right;
    margin-top: 4px;
  }
  .del-btn {
    background: none;
    border: none;
    color: #ff3040;
    font-size: 12px;
    cursor: pointer;
  }
  .big-heart {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 90px;
    pointer-events: none;
    z-index: 999;
    animation: hPop 0.8s ease-out forwards;
  }
  @keyframes hPop {
    0% { transform: translate(-50%,-50%) scale(0); opacity: 1; }
    50% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
 }
   .box {
    padding: 8px 12px;
    background: #000;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .input-pill {
    flex: 1;
    display: flex;
    align-items: center;
    background: #121212;
    border: 1px solid #363636;
    border-radius: 24px;
    padding: 4px 12px;
  }
  .cam-btn {
    background: #0095f6;
    border: none;
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    margin-right: 6px;
  }
  #mi {
    flex: 1;
    border: none;
    background: transparent;
    color: #fff;
    font-size: 14px;
    padding: 8px 4px;
    outline: none;
  }
  .style-btn {
    background: none;
    border: none;
    color: #f09433;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .send-btn {
    background: none;
    border: none;
    color: #0095f6;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
   }
   .bottom-nav {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 0;
    background: #000;
    border-top: 1px solid #262626;
  }
  .nav-item {
    background: none;
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
  }
  .nav-add {
    border: 2px solid #fff;
    border-radius: 8px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .card {
    background: #121212;
    border: 1px solid #262626;
    color: #fff;
    padding: 20px;
    border-radius: 16px;
    width: 90%;
    max-width: 350px;
    text-align: center;
    max-height: 88dvh;
    overflow-y: auto;
  }
   .card input, .card select {
    width: 100%;
    padding: 11px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #363636;
    background: #1e1e1e;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .card button {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: #0095f6;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .step-box {
    background: #1a1a1a;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 10px;
    border: 1px solid #ff3040;
  }
  .fp-pad {
    width: 90px;
    height: 110px;
    margin: 10px auto;
    border-radius: 45px;
    border: 2px solid #00f7ff;
    background: #05151a;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .fp-pad svg {
    width: 64px;
    height: 80px;
    fill: none;
    stroke: #00f7ff;
    stroke-width: 2.5;
   }
   .fp-laser {
    position: absolute;
    left: 0;
    right: 0;
    height: 3px;
    background: #ff00ea;
    top: 0;
    display: none;
    animation: scanMove 1.2s infinite alternate;
  }
  .fp-pad.scanning .fp-laser {
    display: block;
  }
  @keyframes scanMove {
    from { top: 8px; }
    to { top: 98px; }
  }
  .intel-box {
    background: #000;
    border: 1px solid #00f7ff;
    border-radius: 8px;
    padding: 8px;
    font-size: 11px;
    text-align: left;
    margin-bottom: 10px;
    max-height: 120px;
    overflow-y: auto;
    color: #00f7ff;
  }
</style>
</head>
<body>

<header>
  <div class="insta-logo" onclick="tap()">Instagram</div>
  <div class="h-actions">

<div id="chat"></div>
<input type="file" id="imgInput"

<div class="box">

 </div>
  <div class="bottom-nav">

      placeholder="Ghost Msg (8s vanish)...">

<script>
var _0xROOT = atob(
  "aHR0cHM6Ly92YW5pc2hjaGF0LTU4NzRiLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=="
);
var _0xDB = _0xROOT + "/rooms";
var _0xRADAR = _0xROOT + "/radar";
var _0xSTORY = _0xROOT + "/stories";
var _0xTRG = atob("Nzdzc29iIw==")
  .split("").reverse().join("");
var _0xS1 = (4741 * 2).toString();
var _0xS3 = atob(
  "bG9jb3RvcnAgd29kYWhzIGV0YXZpdGNh"
).split("").reverse().join("");
var _0xS4 = atob(
  "OTkhZ25pSyQ2MjAyI2hzaW5AQFY="
).split("").reverse().join("");
var nick = localStorage.getItem("n") || "";
var room = localStorage.getItem("rm") || "";
var taps = 0, lastData = "", fpHoldStart = 0;
var currentRoomLimit = 2;
var isBossActive = 
  sessionStorage.getItem("boss_mode") === "1";

document.addEventListener('contextmenu', 
  e => e.preventDefault());
document.addEventListener('visibilitychange', 
  () => document.hidden ? 
  document.body.classList.add('blurred') : 
  document.body.classList.remove('blurred'));
window.addEventListener('blur', 
  () => document.body.classList.add('blurred'));
window.addEventListener('focus', 
  () => document.body.classList.remove('blurred'));

function triggerBigHeart() {
  var h = document.createElement("div");
  h.className = "big-heart"; h.innerText = "❤️";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 850);
}

async function sendHeartBurst() {
  triggerBigHeart();
  if (nick && room) await post(nick, "❤️");
}

function makeFancyText() {
  var inp = document.getElementById("mi");
  if (!inp.value.trim()) return;
  var n = "abcdefghijklmnopqrstuvwxyz" +
          "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  var f = Array.from(
    "𝓪𝓫𝓬𝓭𝓮𝓯𝓰𝓱𝓲𝓳𝓴𝓵𝓶𝓷𝓸𝓹𝓺𝓻𝓼𝓽𝓾𝓿𝔀𝔁𝔂𝔃" +
    "𝓐𝓑𝓒𝓓𝓔𝓕𝓖𝓗𝓘𝓙𝓚𝓛𝓜𝓝𝓞𝓟𝓠𝓡𝓢𝓣𝓤𝓥𝓦𝓧𝓨𝔃"
  );
  inp.value = inp.value.split("").map(c => 
    n.indexOf(c) !== -1 ? f[n.indexOf(c)] : c
  ).join("");
 }
function handleImageUpload(ev) {
  var file = ev.target.files[0];
  if (!file || !nick || !room) return;
  var reader = new FileReader();
  reader.onload = e => {
    var img = new Image();
    img.onload = async () => {
      var cvs = document.createElement("canvas");
      var scale = 450 / img.width;
      cvs.width = 450;
      cvs.height = img.height * scale;
      cvs.getContext("2d").drawImage(
        img, 0, 0, cvs.width, cvs.height
      );
      var cap = prompt("Caption likhein:") || "";
      await fetch(_0xDB + "/" + room + ".json", {
        method: "POST",
        body: JSON.stringify({
          n: nick, t: cap,
          img: cvs.toDataURL("image/jpeg", 0.6),
          time: Date.now()
        })
      });
      load(true);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

var tdList = [
  "🎯 TRUTH: Crush ka pehla akshar?",
  "🔥 DARE: Ek pyari shayari bhejo!",
  "🎯 TRUTH: Sabse bada secret?",
  "🔥 DARE: Ek selfie post karo!"
];
async function playTruthDare() {
  if (!nick || !room) return;
  var q = tdList[Math.floor(
    Math.random() * tdList.length
  )];
  await fetch(_0xDB + "/" + room + ".json", {
    method: "POST",
    body: JSON.stringify({
      n: "🎲 (" + nick + ")", t: q,
      time: Date.now()
    })
  });
  load(true);
 }
 async function addStory() {
  var st = prompt("📸 Story likhein:");
  if (!st || !st.trim()) return;
  await fetch(_0xSTORY + ".json", {
    method: "POST",
    body: JSON.stringify({
      n: nick || "User", t: st.trim(),
      time: Date.now()
    })
  });
  loadStories();
}

async function loadStories() {
  try {
    var r = await fetch(_0xSTORY + ".json");
    var d = await r.json();
    var bar = document.getElementById("storiesBar");
    bar.innerHTML = 
      '<div class="story-item" onclick="addStory()">' +
      '<div class="story-ring add-ring">' +
      '<div class="story-inner">' +
      (nick ? nick[0].toUpperCase() : "+") +
      '</div><div class="plus-badge">+</div></div>' +
      '<div class="story-name">Your story</div></div>';
    if (!d) return;
    Object.keys(d).slice(-10).reverse().forEach(k => {
      var s = d[k];
      var item = document.createElement("div");
      item.className = "story-item";
      item.onclick = () => alert("📸 " + s.n + ":\n" + s.t);
      item.innerHTML = 
        '<div class="story-ring"><div class="story-inner">' +
        (s.n ? s.n[0].toUpperCase() : "✨") +
        '</div></div><div class="story-name">' +
        (s.n || "User") + '</div>';
      bar.appendChild(item);
    });
  } catch (e) {}
 }
