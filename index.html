<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e4620" />
  <title>Vanish Chat</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --accent: #245c36;
      --text: #1c1e1d;
      --sub: #6b726e;
      --bubble-me: #d9edd9;
      --bubble-other: #ffffff;
    }
    body.mood-warm { --bg: #fdf5e6; --accent: #b85d19; --bubble-me: #fde3c2; }
    body.mood-calm { --bg: #eef6f4; --accent: #1d6b52; --bubble-me: #d4ede6; }
    body.mood-quiet { --bg: #16181a; --card: #222528; --accent: #52a873; --text: #f0f2f1; --sub: #9aa19d; --bubble-me: #21402d; --bubble-other: #2a2e33; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; transition: background 0.4s ease, color 0.3s ease; overflow: hidden; }
    
    header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; background: var(--card); border-bottom: 1px solid rgba(0,0,0,0.06); }
    .brand { font-size: 20px; font-weight: 800; color: var(--accent); user-select: none; cursor: pointer; }
    select { padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.12); background: var(--bg); color: var(--text); font-weight: 600; font-size: 13px; }

    .hero { padding: 14px 18px 6px; }
    .hero small { font-size: 11px; letter-spacing: 1px; color: var(--sub); text-transform: uppercase; font-weight: 700; }
    .hero h1 { font-size: 26px; margin-top: 2px; }
    .hero p { font-size: 13px; color: var(--sub); }

    #chatBox { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; box-shadow: 0 2px 6px rgba(0,0,0,0.04); animation: fadeIn 0.25s ease; }
    .msg.me { align-self: flex-end; background: var(--bubble-me); border-bottom-right-radius: 4px; }
    .msg.other { align-self: flex-start; background: var(--bubble-other); border-bottom-left-radius: 4px; }
    .msg-meta { font-size: 11px; color: var(--sub); margin-bottom: 3px; font-weight: 600; }
    .vanish-tag { font-size: 10px; color: var(--accent); text-align: right; margin-top: 4px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .controls { background: var(--card); padding: 12px 16px 18px; border-top-left-radius: 22px; border-top-right-radius: 22px; box-shadow: 0 -4px 16px rgba(0,0,0,0.05); }
    .moods { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 600; }
    .mood-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.1); background: transparent; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; }
    .mood-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .input-row { display: flex; gap: 8px; }
    input[type="text"], input[type="password"] { flex: 1; padding: 12px 14px; border-radius: 24px; border: 1px solid rgba(0,0,0,0.12); background: var(--bg); color: var(--text); font-size: 15px; outline: none; }
    .send-btn { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 99; }
    .modal-card { background: var(--card); color: var(--text); width: 100%; max-width: 380px; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .room-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
    .btn-sm { padding: 6px 12px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    .btn-danger { background: #c93b3b; }
  </style>
</head>
<body class="mood-calm">

  <header>
    <div class="brand" id="secretTitle">Vanish Chat</div>
    <select id="roomSelect" onchange="switchRoom()"></select>
  </header>

  <div class="hero">
    <small>LIVE EPHEMERAL ROOM</small>
    <h1>Say it here.</h1>
    <p>Messages vanish automatically after 30 seconds.</p>
  </div>

  <div id="chatBox"></div>

  <div class="controls">
    <div class="moods">
      <span>My mood:</span>
      <button class="mood-btn" onclick="setMood('warm', this)">☀️ Warm</button>
      <button class="mood-btn active" onclick="setMood('calm', this)">🍃 Calm</button>
      <button class="mood-btn" onclick="setMood('quiet', this)">🌙 Quiet</button>
    </div>
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Write a fleeting message..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="send-btn" onclick="sendMessage()">↑</button>
    </div>
  </div>

  <!-- Name Prompt Modal -->
  <div class="modal" id="nameModal" style="display:flex;">
    <div class="modal-card">
      <h3 style="margin-bottom:8px;">Welcome to Vanish Chat</h3>
      <p style="font-size:13px; color:var(--sub); margin-bottom:14px;">Enter a secret nickname to join live rooms:</p>
      <div class="input-row">
        <input type="text" id="nickInput" placeholder="Your nickname..." />
        <button class="btn-sm" onclick="saveNick()">Join</button>
      </div>
    </div>
  </div>

  <!-- Secret PIN Modal -->
  <div class="modal" id="pinModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Security Check</h3>
        <button onclick="closeModals()" style="border:none;background:none;font-size:18px;color:var(--text);">✕</button>
      </div>
      <div class="input-row">
        <input type="password" id="pinInput" placeholder="Enter 6-digit PIN" maxlength="6" />
        <button class="btn-sm" onclick="verifyPin()">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Secret Admin Panel -->
  <div class="modal" id="adminModal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <small style="color:var(--accent);font-weight:700;">PRIVATE CONTROLS</small>
          <h3>Admin Settings</h3>
        </div>
        <button onclick="closeModals()" style="border:none;background:none;font-size:20px;color:var(--text);">✕</button>
      </div>
      <div class="input-row" style="margin-bottom:14px;">
        <input type="text" id="newRoomInput" placeholder="New secret room name..." />
        <button class="btn-sm" onclick="createRoom()">Create</button>
      </div>
      <div id="adminRoomList" style="max-height:200px;overflow-y:auto;"></div>
    </div>
  </div>

  <script>
    const DB_URL = "https://firebaseio.com";
    const SECRET_PIN = "849271";
    let userNick = localStorage.getItem("vc_nick") || "";
    let currentRoom = "General_Room";
    let tapCount = 0, tapTimer = null;

    if (userNick) document.getElementById("nameModal").style.display = "none";

    function saveNick() {
      const val = document.getElementById("nickInput").value.trim();
      if (!val) return;
      userNick = val;
      localStorage.setItem("vc_nick", userNick);
      document.getElementById("nameModal").style.display = "none";
    }

    // 5-Tap Secret Trigger
    document.getElementById("secretTitle").addEventListener("click", () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
      if (tapCount === 5) {
        tapCount = 0;
        document.getElementById("pinInput").value = "";
        document.getElementById("pinModal").style.display = "flex";
      }
    });

    function verifyPin() {
      const entered = document.getElementById("pinInput").value;
      closeModals();
      if (entered === SECRET_PIN) {
        document.getElementById("adminModal").style.display = "flex";
        loadRooms();
      }
    }

    function closeModals() {
      document.getElementById("pinModal").style.display = "none";
      document.getElementById("adminModal").style.display = "none";
    }

    function setMood(mood, btn) {
      document.body.className = "mood-" + mood;
      document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    async function loadRooms() {
      try {
        const res = await fetch(`${DB_URL}/rooms.json`);
        let rooms = await res.json();
        if (!rooms) {
          rooms = { General_Room: "The Little Room" };
          await fetch(`${DB_URL}/rooms.json`, { method: "PUT", body: JSON.stringify(rooms) });
        }
        const sel = document.getElementById("roomSelect");
        const adminList = document.getElementById("adminRoomList");
        sel.innerHTML = "";
        adminList.innerHTML = "";
        Object.keys(rooms).forEach(key => {
          const opt = document.createElement("option");
          opt.value = key;
          opt.textContent = rooms[key];
          if (key === currentRoom) opt.selected = true;
          sel.appendChild(opt);

          const div = document.createElement("div");
          div.className = "room-item";
          div.innerHTML = `<span><b>${rooms[key]}</b></span>
            <div>
              <button class="btn-sm" onclick="selectRoomFromAdmin('${key}')">Open</button>
              ${key !== 'General_Room' ? `<button class="btn-sm btn-danger" onclick="deleteRoom('${key}')">Delete</button>` : ''}
            </div>`;
          adminList.appendChild(div);
        });
