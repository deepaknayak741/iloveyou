<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width">
<title>Insta App</title>
<style>
body {
 background: #000;
 color: #fff;
 font-family: sans-serif;
 padding: 12px;
}
.box {
 background: #141414;
 border: 1px solid #333;
 border-radius: 12px;
 padding: 15px;
}
h3 {
 color: #e1306c;
 text-align: center;
}
input {
 width: 90%;
 padding: 10px;
 margin: 6px 0;
 background: #222;
 color: #fff;
 border: 1px solid #444;
 border-radius: 8px;
}
.btn {
 width: 98%;
 padding: 10px;
 margin-top: 6px;
 border: none;
 border-radius: 8px;
 font-weight: bold;
 color: #fff;
}
.pink {
 background: #e1306c;
}
.green {
 background: #00b86b;
}
.chat {
 margin-top: 12px;
 border: 1px solid #333;
 padding: 10px;
 height: 160px;
 overflow-y: auto;
}
</style>
</head>
<body>
<div class="box">
<h3>📸 Insta Live App</h3>

<input type="text"
 id="tk"
 placeholder="Token डालें">

<button class="btn pink"
 onclick="start()">
📡 लाइव मैसेज चालू करें
</button>

<div class="chat"
 id="inbox">
यहाँ मैसेज दिखेंगे...
</div>

<input type="text"
 id="rid"
 placeholder="रिप्लाई ID">

<input type="text"
 id="txt"
 placeholder="जवाब लिखें...">

<button class="btn green"
 onclick="reply()">
📤 जवाब भेजें
</button>
</div>
<script>
let tm = null;
const host = [
 "https:", "",
 "graph." +
"facebook.com",
 "v21.0", "me"
].join("/");

function start() {
 let t = document
  .getElementById('tk')
  .value.trim();
 if (!t) {
  alert("Token डालें!");
  return;
 }
 document
  .getElementById('inbox')
  .innerHTML =
  "चेक हो रहा है...";
 if (tm) clearInterval(tm);
 load(t);
 tm = setInterval(
  () => load(t), 10000
 );
}

async function load(t) {
 let u = host +
"/conversations?" +
"platform=instagram&" +
"limit=5&fields=" +
"participants," +
"messages.limit(1)" +
"{message,from}&" +
"access_token=" + t;
try {
 let r = await fetch(u);
 let d = await r.json();
 let bx = document
  .getElementById('inbox');
 if (d.error) {
  bx.innerHTML =
   "❌ " + d.error.message;
  return;
 }
 if (d.data &&
     d.data.length > 0) {
  bx.innerHTML = "";
    d.data.forEach(c => {
   let m = c.messages.data.at(0);
   let p = c.participants.data
    .find(x => x.id !=
    "17841451638514561");
   let i = p ? p.id : m.from.id;
   let n = (p && p.username)
    || m.from.name || "User";
   bx.innerHTML +=
    `<p onclick="setId('${i}')">` +
    `<b>${n}:</b> ${m.message} ` +
    `<small style="color:#0f9">` +
    `[रिप्लाई]</small></p>`;
  });
 } 
  } else {
   bx.innerHTML =
    "कोई मैसेज नहीं है।";
  }
 } catch (e) {
  console.log(e);
 }
}

function setId(id) {
 document
  .getElementById('rid')
  .value = id;
}

async function reply() {
 let t = document
  .getElementById('tk')
  .value.trim();
 let id = document
  .getElementById('rid')
  .value.trim();
 let tx = document
  .getElementById('txt')
  .value.trim();

 if (!t || !id || !tx) {
  alert("सब भरें!");
  return;
 }

 let u = host +
  "/messages?" +
  "access_token=" + t;

 let r = await fetch(u, {
  method: "POST",
  headers: {
   "Content-Type":
    "application/json"
  },
  body: JSON.stringify({
   recipient: { id: id },
   message: { text: tx }
  })
 });

 let res = await r.json();
 if (res.message_id) {
  alert("✅ चला गया!");
  document
   .getElementById('txt')
   .value = "";
 } else {
  alert("❌ " +
   res.error.message);
 }
}
</script>
</body>
 </html>
