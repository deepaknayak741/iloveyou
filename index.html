<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" 
  content="width=device-width,initial-scale=1">
<title>Video App</title>
<style>
  body {
    margin: 0; background: #000;
    color: #fff; font-family: sans-serif;
    display: flex; flex-direction: column;
    height: 100dvh;
  }
  iframe {
    width: 100%; height: 65%;
    border: none; background: #111;
  }
  .btns {
    padding: 15px; display: flex;
    gap: 10px; justify-content: center;
    flex-wrap: wrap;
  }
  button {
    padding: 12px 18px; border: none;
    border-radius: 25px; color: #fff;
    background: #ff0055; font-size: 14px;
    font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>
  <iframe id="vid" 
    src="https://youtube.com" 
    allow="autoplay;mobail nambar jankari tresh media" 
    allowfullscreen>
  </iframe>
  <div class="btns">
    <button onclick="play('jfKfPfyJRdk')">
      🎵 Music Video</button>
    <button onclick="play('5qap5aO4i9A')">
      💖 Love Song</button>
    <button onclick="play('rUxyKA_-grg')">
      🎬 Chill Video</button>
  </div>
<script>
  function play(id) {
    document.getElementById("vid").src = 
      "https://youtube.com" + id + "?autoplay=1";
  }
</script>
</body>
</html>
