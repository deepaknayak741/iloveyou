<!DOCTYPE html>
<html>
<head>
<meta
 charset="UTF-8">
<meta
 name="viewport"
 content=
 "width=device-width">
<title>
Insta Live App
</title>
<style>
body {
 background: #000;
 color: #fff;
 font-family:
  sans-serif;
 padding: 12px;
}
.box {
 background: #141414;
 border:
  1px solid #333;
 border-radius: 12px;
 padding: 15px;
}
h3 {
 color: #e1306c;
 text-align: center;
 margin-top: 0;
}
input {
 width: 90%;
 padding: 10px;
 margin: 6px 0;
 background: #222;
 color: #fff;
 border:
  1px solid #444;
 border-radius: 8px;
}
.btn {
 width: 98%;
 padding: 10px;
 margin-top: 6px;
 border: none;
 border-radius: 8px;
 font-weight: bold;
 color: #fff;
}
.pink {
 background: #e1306c;
}
.green {
 background: #00b86b;
}
.chat {
 margin-top: 12px;
 border:
  1px solid #333;
 padding: 10px;
 height: 160px;
 overflow-y: auto;
 font-size: 14px;
}
</style>
</head>
<body>

<div class="box">
<h3>📸 Insta Live App</h3>

<input
 type="text"
 id="tk"
 placeholder=
 "1. अपना Token डालें">

<button
 class="btn pink"
 onclick="start()">
📡 लाइव मैसेज चालू करें
</button>

<div
 class="chat"
 id="inbox">
यहाँ मैसेज दिखेंगे...
</div>

<input
 type="text"
 id="rid"
 placeholder=
 "रिप्लाई ID (क्लिक करें)">

<input
 type="text"
 id="txt"
 placeholder=
 "अपना जवाब लिखें...">

<button
 class="btn green"
 onclick="reply()">
📤 जवाब भेजें (Send)
</button>
</div>
<script>
let tm = null;

function start() {
 let t = document
  .getElementById('tk')
  .value.trim();

 if (t === "") {
  alert("Token डालें!");
  return;
 }

 let bx = document
  .getElementById('inbox');
 bx.innerHTML =
  "जुड़ रहा है...<br>";

 if (tm) clearInterval(tm);
 load(t);
 tm = setInterval(
  function() {
   load(t);
  },
  4000
 );
}

async function load(t) {let u = "https://graph.";
u += "://facebook.com";
 u += "me/conversations?";
 u += "platform=instagram";
 u += "&fields=messages";
 u += "{message,from}";
 u += "&access_token=" + t;

 try {
  let r = await fetch(u);
  let d = await r.json();
  let bx = document
   .getElementById('inbox');

  if (d.error) {
   bx.innerHTML =
    "❌ एरर: " +
    d.error.message;
   return;
  }

  if (d.data &&
      d.data.length > 0) {
   bx.innerHTML = "";
   let list = d.data
    .messages.data;

   list.forEach(function(m) {
    let nm = m.from.name
     || "User";
    let id = m.from.id;
    let h = "<p onclick=\"";
    h += "setId('" + id;
    h += "')\" style='";
    h += "border-bottom:";
    h += "1px solid #333;'>";
    h += "<b>" + nm + ":</b> ";
    h += m.message;
    h += " <small style='";
    h += "color:#00ff96;'>";
    h += "[रिप्लाई]</small></p>";
    bx.innerHTML += h;
   });
  } else {
   bx.innerHTML =
    "कोई नया मैसेज नहीं है।";
  }
 } catch (e) {
  console.log(e);
 }
}

function setId(id) {
 document
  .getElementById('rid')
  .value = id;
}

async function reply() {
 let t = document
  .getElementById('tk')
  .value.trim();
 let id = document
  .getElementById('rid')
  .value.trim();
 let tx = document
  .getElementById('txt')
  .value.trim();

 if (!t || !id || !tx) {
  alert("सब बॉक्स भरें!");
  return;
 }

 let u = "https://graph.";let u = "https://graph.";
u += "://facebook.com";
 u += "access_token=" + t;

 let bodyData = {
  recipient: { id: id },
  message: { text: tx }
 };

 let r = await fetch(u, {
  method: "POST",
  headers: {
   "Content-Type":
    "application/json"
  },
  body: JSON.stringify(
   bodyData
  )
 });

 let res = await r.json();
 if (res.message_id) {
  alert("✅ मैसेज चला गया!");
  document
   .getElementById('txt')
   .value = "";
 } else {
  alert("❌ एरर: " +
   res.error.message);
 }
}
</script>
</body>
</html>
