<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanish Chat</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #000; color: #fff; }
  .header { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 14px; text-align: center; font-size: 20px; font-weight: bold; }
  .ad-btn { display: block; background: #1e1e1e; color: #ffcc00; text-align: center; padding: 10px; font-size: 13px; font-weight: bold; text-decoration: none; border-bottom: 1px solid #333; }
  .tabs { display: flex; background: #121212; border-bottom: 1px solid #222; }
  .tab { flex: 1; padding: 12px; text-align: center; font-weight: bold; color: #888; }
  .tab.active { color: #ff0055; border-bottom: 2px solid #ff0055; }
  .page { display: none; padding: 15px; padding-bottom: 85px; }
  .page.active { display: block; }
    .msg { background: #1a1a1a; padding: 10px 14px; border-radius: 15px; margin-bottom: 10px; max-width: 82%; border-left: 3px solid #ff0055; }
  .msg small { color: #ff0055; display: block; font-size: 11px; margin-bottom: 3px; font-weight: bold; }
  .chat-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #121212; padding: 10px; display: flex; gap: 6px; border-top: 1px solid #222; }
  input { padding: 10px; border-radius: 20px; border: none; background: #262626; color: #fff; outline: none; }
  button { background: #ff0055; color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; }
  .video-card { background: #121212; border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 1px solid #222; }
  iframe { width: 100%; height: 200px; border: none; }
</style>
</head>
<body>
  <div class="header">✨ Vanish Chat ✨</div>

<a href="https://bicea.org" target="_blank" class="ad-btn">
  🎁 यहाँ क्लिक करें और स्पेशल ऑफर देखें (Sponsored)
</a>

<div class="tabs">
  <div class="tab active" onclick="showTab('chat', this)">💬 पब्लिक चैट</div>
  <div class="tab" onclick="showTab('media', this)">🎵 गाने & रील्स</div>
</div>

<div id="chat" class="page active">
  <div id="messages">
    <div class="msg"><small>Admin (Deepak)</small>स्वागत है! अपना नाम लिखें और चैट शुरू करें।</div>
  </div>
  <div class="chat-bar">
    <input type="text" id="userName" placeholder="नाम" style="width: 70px;">
    <input type="text" id="msgInput" placeholder="मैसेज लिखें..." style="flex: 1;">
    <button onclick="sendMsg()">भेजें</button>
  </div>
      </div>
      <div id="media" class="page">
  <div class="video-card">
    <iframe src="https://youtube.com" allowfullscreen></iframe>
    <div style="padding:10px; font-size:14px;">🎶 24/7 रोमांटिक & रिलैक्सिंग म्यूजिक</div>
  </div>
  <div class="video-card">
    <iframe src="https://youtube.com" allowfullscreen></iframe>
    <div style="padding:10px; font-size:14px;">✨ फैंटेसी वाइब्स & स्टेटस</div>
  </div>
</div>

<script>
  function showTab(id, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
  }
  function sendMsg() {
    let name = document.getElementById('userName').value.trim() || 'Guest';
    let inp = document.getElementById('msgInput');
    if(!inp.value.trim()) return;
    let box = document.getElementById('messages');
    box.innerHTML += `<div class="msg"><small>${name}</small>${inp.value}</div>`;
    inp.value = '';
    window.scrollTo(0, document.body.scrollHeight);
  }
</script>
</body>
</html>
