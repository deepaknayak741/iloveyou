<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrics & Sketch Maker</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  body { margin: 0; font-family: sans-serif; background: #0f0f0f; color: #fff; padding-bottom: 40px; }
  .header { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
  .share-btn { background: #000; color: #fff; border: none; padding: 7px 14px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .ad-btn { display: block; background: #1e1e1e; color: #ffcc00; text-align: center; padding: 10px; font-size: 13px; font-weight: bold; text-decoration: none; border-bottom: 1px solid #333; }
  
  .container { padding: 15px; max-width: 500px; margin: auto; }
  .input-group { margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #bbb; margin-bottom: 5px; font-weight: bold; }
  input[type="text"], textarea, input[type="file"] {
    width: 100%; box-sizing: border-box; padding: 10px; border-radius: 10px;
    border: 1px solid #333; background: #1c1c1c; color: #fff; font-size: 14px; outline: none;
  }
  textarea { height: 110px; resize: vertical; }
  
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; }
  .btn-gen { background: #ff0055; color: #fff; }
  .btn-dl { background: #00c853; color: #fff; }

  .preview-box { margin-top: 20px; text-align: center; }
  canvas { width: 100%; max-width: 400px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); background: #fff; }
</style>
</head>
<body>

<div class="header">
  <span>✍️ Lyrics Sketch Maker</span>
  <button onclick="shareApp()" class="share-btn">📲 शेयर करें</button>
</div>

<a href="https://bicea.org" target="_blank" class="ad-btn">
  🎁 यहाँ क्लिक करें और स्पेशल ऑफर देखें (Sponsored)
</a>

<div class="container">
  <div class="input-group">
    <label>1. गाने का टाइटल (Title):</label>
    <input type="text" id="songTitle" value="Ramayan Ka Saar" oninput="drawPoster()">
  </div>

  <div class="input-group">
    <label>2. गाने के बोल (Lyrics):</label>
    <textarea id="songLyrics" oninput="drawPoster()">जे महाभारत की बात करूं,
कित भीम ने गोला गेरया था?
अरे कौनसी मने बता दे, अर्जुन 47 ले रहा था?
रे पढ़ ले रामायण का सार,
दिया था रावण तीर तै मार...</textarea>
  </div>

  <div class="input-group">
    <label>3. अपनी फोटो चुनें (स्केच बनाने के लिए):</label>
    <input type="file" id="photoInput" accept="image/*" onchange="loadUserImage(event)">
  </div>

  <div class="btn-row">
    <button class="btn btn-gen" onclick="drawPoster()">✨ पोस्टर अपडेट करें</button>
    <button class="btn btn-dl" onclick="downloadPoster()">⬇️ फोटो सेव करें</button>
  </div>

  <div class="preview-box">
    <canvas id="posterCanvas" width="720" height="1280"></canvas>
  </div>
</div>

<script>
  const canvas = document.getElementById('posterCanvas');
  const ctx = canvas.getContext('2d');
  let userSketchCanvas = null;

  function shareApp() {
    if (navigator.share) {
      navigator.share({
        title: 'Lyrics Sketch Maker',
        text: 'अपनी फोटो का नोटबुक स्केच और लिरिक्स पोस्टर बनाएं:',
        url: window.location.href
      });
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('लिंक कॉपी हो गया है!');
    }
  }

  // फोटो को पेंसिल/बॉलपेन स्केच में बदलने का फंक्शन
  function loadUserImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        userSketchCanvas = convertToSketch(img);
        drawPoster();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function convertToSketch(img) {
    const tempCanvas = document.createElement('canvas');
    const w = 360;
    const h = (img.height / img.width) * w;
    tempCanvas.width = w;
    tempCanvas.height = h;
    const tCtx = tempCanvas.getContext('2d');

    // ग्रेस्केल और हाई-कंट्रास्ट स्केच इफेक्ट
    tCtx.drawImage(img, 0, 0, w, h);
    const imgData = tCtx.getImageData(0, 0, w, h);
    const data = imgData.data;

    // स्केच एज डिटेक्शन (Color Dodge Simulation)
    const gray = new Uint8ClampedArray(w * h);
    for (let i = 0; i < data.length; i += 4) {
      gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    }

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        // आस-पास के पिक्सल से तुलना करके स्केच की लाइनें निकालना
        const diff = Math.abs(gray[idx] - gray[idx - 1]) + Math.abs(gray[idx] - gray[idx - w]);
        let val = 255 - (diff * 3.5);
        if (gray[idx] < 70) val = Math.min(val, gray[idx] * 1.5); // गहरे हिस्सों में शेडिंग
        val = Math.max(0, Math.min(255, val));

        const pIdx = idx * 4;
        // हल्का नीला/काला पेन इंक टोन
        data[pIdx] = val * 0.88;     // R
        data[pIdx + 1] = val * 0.90; // G
        data[pIdx + 2] = val;        // B
        // सफेद बैकग्राउंड को पारदर्शी (Transparent) बनाना ताकि कॉपी की लाइनें दिखें
        data[pIdx + 3] = val > 225 ? 0 : 255; 
      }
    }
    tCtx.putImageData(imgData, 0, 0);
    return tempCanvas;
  }

  // नोटबुक का पन्ना, लिरिक्स और स्केच बनाने का मुख्य फंक्शन
  function drawPoster() {
    const w = canvas.width;
    const h = canvas.height;

    // 1. कागज़ का बैकग्राउंड रंग
    ctx.fillStyle = '#fbf9f2';
    ctx.fillRect(0, 0, w, h);

    // 2. बाईं तरफ स्पाइरल बाइंडिंग के छेद और रिंग्स
    ctx.fillStyle = '#222';
    for (let y = 35; y < h - 20; y += 42) {
      ctx.beginPath();
      ctx.arc(32, y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, y - 3);
      ctx.lineTo(32, y);
      ctx.stroke();
    }

    // 3. कॉपी की नीली/ग्रे लाइनें
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 2;
    for (let y = 210; y < h - 40; y += 44) {
      ctx.beginPath();
      ctx.moveTo(60, y);
      ctx.lineTo(w - 20, y);
      ctx.stroke();
    }

    // 4. ऊपर लाल डबल मार्जिन लाइन
    ctx.strokeStyle = '#e11d48';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(60, 195); ctx.lineTo(w - 20, 195);
    ctx.moveTo(60, 202); ctx.lineTo(w - 20, 202);
    ctx.stroke();

    // 5. टाइटल लिखना (पेन की स्याही जैसा नीला रंग)
    const title = document.getElementById('songTitle').value;
    ctx.fillStyle = '#1e3a8a';
    ctx.font = 'bold 78px "Caveat", "Kalam", cursive';
    ctx.textAlign = 'center';
    ctx.fillText(title, w / 2 + 20, 140);

    // 6. दाईं तरफ यूज़र की फोटो का स्केच लगाना
    if (userSketchCanvas) {
      const sw = 340;
      const sh = (userSketchCanvas.height / userSketchCanvas.width) * sw;
      ctx.drawImage(userSketchCanvas, w - sw - 15, h - sh - 30, sw, sh);
    }

    // 7. बाईं तरफ लिरिक्स लिखना
    const lyrics = document.getElementById('songLyrics').value.split('\n');
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 30px "Kalam", cursive';
    ctx.textAlign = 'left';
    let startY = 245;
    lyrics.forEach((line) => {
      ctx.fillText(line, 80, startY);
      startY += 44; // हर लाइन कॉपी की लाइन के ऊपर बैठेगी
    });
  }

  // इमेज डाउनलोड करने का फंक्शन
  function downloadPoster() {
    const link = document.createElement('a');
    link.download = 'lyrics-sketch-poster.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // पेज लोड होते ही डिफ़ॉल्ट पोस्टर दिखाएं
  window.onload = () => {
    setTimeout(drawPoster, 500);
  };
</script>

</body>
                                              </html>
